name: Encrypt and Push to Encrypted Repository

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target encrypted repository (format: owner/repo)'
        required: false
        default: 'eit-nlp-industry/LLaMA-Factory-encrypted'
        type: string
      target_branch:
        description: 'Target branch'
        required: false
        default: 'main'
        type: string
  push:
    branches:
      - main
      - master

env:
  ENCRYPTED_REPO: ${{ github.event.inputs.target_repo || 'eit-nlp-industry/LLaMA-Factory-encrypted' }}
  ENCRYPTED_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}

jobs:
  encrypt-and-push:
    name: Encrypt Repository and Push
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install git-crypt
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt
          
      - name: Setup GPG for encryption
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Error: GPG_PRIVATE_KEY Secret is not set"
            exit 1
          fi
          
          echo "Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import 2>&1 || {
            echo "Error: Failed to import GPG private key"
            exit 1
          }
          
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG 2>/dev/null | grep -E "sec\s+[a-zA-Z0-9/]+" | head -1 | awk '{print $2}' | cut -d'/' -f2)
          
          if [ -z "$GPG_KEY_ID" ]; then
            echo "Error: Failed to get GPG key ID"
            gpg --list-secret-keys --keyid-format LONG
            exit 1
          fi
          
          echo "GPG Key ID: $GPG_KEY_ID"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
          
          # Get full fingerprint for trust setting
          GPG_FINGERPRINT=$(gpg --list-secret-keys --fingerprint --with-colons | grep '^fpr:' | head -1 | cut -d':' -f10)
          echo "GPG Fingerprint: $GPG_FINGERPRINT"
          
          # Set ultimate trust for the key
          echo "$GPG_FINGERPRINT:6:" | gpg --import-ownertrust
          
          if [ ! -d .git-crypt ]; then
            echo "Initializing git-crypt..."
            git-crypt init
          else
            echo "git-crypt already initialized"
          fi
          
          echo "Adding GPG user to git-crypt..."
          if [ -n "$GPG_PASSPHRASE" ] && [ "$GPG_PASSPHRASE" != "" ]; then
            echo "$GPG_PASSPHRASE" | git-crypt add-gpg-user --trusted "$GPG_KEY_ID" 2>&1 || echo "Warning: User may already be added"
          else
            git-crypt add-gpg-user --trusted "$GPG_KEY_ID" 2>&1 || echo "Warning: User may already be added"
          fi
          
      - name: Encrypt repository
        run: |
          set -e
          echo "Unlocking git-crypt..."
          git-crypt unlock 2>&1 || echo "Warning: git-crypt may already be unlocked"
          echo "Checking encryption status..."
          git-crypt status | head -20 || true
          
          # Remove .github directory completely (should not be in encrypted repo)
          echo "Removing .github directory from encrypted repository..."
          if [ -d .github ]; then
            git rm -rf --cached .github 2>/dev/null || true
            rm -rf .github
            echo "✓ .github directory removed"
          fi
          
          # Also remove other non-encrypted directories that shouldn't be in encrypted repo
          for dir in docker examples tests; do
            if [ -d "$dir" ]; then
              git rm -rf --cached "$dir" 2>/dev/null || true
              echo "Removed $dir directory"
            fi
          done
          
          git add -A
          git status --short | head -20 || true
          
          # Verify .github is not in staging
          if git diff --cached --name-only | grep -q "^\.github/"; then
            echo "Warning: .github files still in staging, removing..."
            git reset HEAD .github 2>/dev/null || true
          fi
          
      - name: Setup target repository
        env:
          ENCRYPTED_REPO_TOKEN: ${{ secrets.ENCRYPTED_REPO_TOKEN }}
        run: |
          set -e
          
          if [ -z "$ENCRYPTED_REPO_TOKEN" ]; then
            echo "Error: ENCRYPTED_REPO_TOKEN Secret is not set"
            exit 1
          fi
          
          echo "Debug: Token length: ${#ENCRYPTED_REPO_TOKEN}"
          echo "Debug: Token prefix: ${ENCRYPTED_REPO_TOKEN:0:7}..."
          echo "Debug: Target repo: ${{ env.ENCRYPTED_REPO }}"
          
          # Test token access
          echo "Testing token access to repository..."
          curl -s -H "Authorization: token $ENCRYPTED_REPO_TOKEN" \
            "https://api.github.com/repos/${{ env.ENCRYPTED_REPO }}" | \
            jq -r '.name, .private, .permissions' || echo "API test failed"

          # IMPORTANT:
          # actions/checkout configures http.https://github.com/.extraheader using GITHUB_TOKEN.
          # That extraheader applies to ALL github.com git traffic and can override our PAT,
          # causing private target repos to return "404 Repository not found".
          git config --local  --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote remove encrypted-origin 2>/dev/null || true
          
          echo "Adding remote repository: ${{ env.ENCRYPTED_REPO }}"
          
          # URL encode the token to handle special characters
          ENCODED_TOKEN=$(echo -n "$ENCRYPTED_REPO_TOKEN" | jq -sRr @uri)
          echo "Debug: Encoded token length: ${#ENCODED_TOKEN}"
          
          git remote add encrypted-origin "https://x-access-token:${ENCRYPTED_REPO_TOKEN}@github.com/${{ env.ENCRYPTED_REPO }}.git"
          
          git remote -v
          
          # Test remote access with verbose output
          echo "Testing remote access..."
          LS_REMOTE_RESULT=$(GIT_CURL_VERBOSE=1 GIT_TRACE=1 git ls-remote encrypted-origin HEAD 2>&1) || {
            echo "Warning: ls-remote failed"
            echo "Error output: $LS_REMOTE_RESULT"
          }
          
          if [ -n "$LS_REMOTE_RESULT" ] && echo "$LS_REMOTE_RESULT" | grep -q "refs/heads"; then
            echo "✓ Remote access successful"
            echo "$LS_REMOTE_RESULT" | head -5
          else
            echo "⚠ Remote access test inconclusive, will try push anyway"
          fi
          
      - name: Push to encrypted repository
        env:
          ENCRYPTED_REPO_TOKEN: ${{ secrets.ENCRYPTED_REPO_TOKEN }}
        run: |
          set -e

          # Unset checkout-injected auth header again (safety).
          git config --local  --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true

          # Re-add remote with PAT in URL.
          git remote remove encrypted-origin 2>/dev/null || true
          git remote add encrypted-origin "https://x-access-token:${ENCRYPTED_REPO_TOKEN}@github.com/${{ env.ENCRYPTED_REPO }}.git"
          
          echo "Verifying remote configuration..."
          git remote -v
          
          # Direct push attempt
          echo "Attempting to push to encrypted repository..."
          echo "Target: ${{ env.ENCRYPTED_REPO }}"
          echo "Branch: ${{ env.ENCRYPTED_BRANCH }}"
          
          # Try push
          export GIT_TERMINAL_PROMPT=0
          git push encrypted-origin HEAD:${{ env.ENCRYPTED_BRANCH }} 2>&1 || {
            echo "First push attempt failed, trying with --force..."
            git push encrypted-origin HEAD:${{ env.ENCRYPTED_BRANCH }} --force 2>&1 || {
              echo "Push failed. Final verification..."
              curl -s -H "Authorization: token ${ENCRYPTED_REPO_TOKEN}" \
                "https://api.github.com/repos/${{ env.ENCRYPTED_REPO }}" | jq -r '.name, .message, .permissions' || true
              exit 1
            }
          }
          
          echo "✓ Push successful!"
          
      - name: Cleanup
        if: always()
        run: |
          gpg --batch --yes --delete-secret-keys "$GPG_KEY_ID" || true
          gpg --batch --yes --delete-keys "$GPG_KEY_ID" || true
