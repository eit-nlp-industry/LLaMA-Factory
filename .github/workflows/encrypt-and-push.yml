name: Encrypt and Push to Encrypted Repository

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target encrypted repository (format: owner/repo)'
        required: false
        default: 'eit-nlp-industry/LLaMA-Factory-encrypted'
        type: string
      target_branch:
        description: 'Target branch'
        required: false
        default: 'main'
        type: string
  push:
    branches:
      - main
      - master

env:
  ENCRYPTED_REPO: ${{ github.event.inputs.target_repo || 'eit-nlp-industry/LLaMA-Factory-encrypted' }}
  ENCRYPTED_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}

jobs:
  encrypt-and-push:
    name: Encrypt Repository and Push
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install git-crypt
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt
          
      - name: Setup GPG for encryption
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Error: GPG_PRIVATE_KEY Secret is not set"
            exit 1
          fi
          
          echo "Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import 2>&1 || {
            echo "Error: Failed to import GPG private key"
            exit 1
          }
          
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG 2>/dev/null | grep -E "sec\s+[a-zA-Z0-9/]+" | head -1 | awk '{print $2}' | cut -d'/' -f2)
          
          if [ -z "$GPG_KEY_ID" ]; then
            echo "Error: Failed to get GPG key ID"
            gpg --list-secret-keys --keyid-format LONG
            exit 1
          fi
          
          echo "GPG Key ID: $GPG_KEY_ID"
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
          
          # Get full fingerprint for trust setting
          GPG_FINGERPRINT=$(gpg --list-secret-keys --fingerprint --with-colons | grep '^fpr:' | head -1 | cut -d':' -f10)
          echo "GPG Fingerprint: $GPG_FINGERPRINT"
          
          # Set ultimate trust for the key
          echo "$GPG_FINGERPRINT:6:" | gpg --import-ownertrust
          
          # Check if git-crypt is initialized and if current GPG key can unlock it
          if [ ! -d .git-crypt ]; then
            echo "Initializing git-crypt..."
            git-crypt init
          else
            echo "git-crypt already initialized"
            # Try to unlock to check if current GPG key works
            if git-crypt unlock 2>/dev/null; then
              echo "✓ Can unlock with current GPG key"
            else
              echo "⚠ Cannot unlock - repository may have different GPG keys"
              echo "Re-initializing git-crypt to use current GPG key..."
              # Remove old git-crypt directory
              rm -rf .git-crypt
              git-crypt init
            fi
          fi
          
          echo "Adding GPG user to git-crypt..."
          if [ -n "$GPG_PASSPHRASE" ] && [ "$GPG_PASSPHRASE" != "" ]; then
            echo "$GPG_PASSPHRASE" | git-crypt add-gpg-user --trusted "$GPG_KEY_ID" 2>&1 || {
              echo "Warning: Failed to add GPG user, may already be added"
            }
          else
            git-crypt add-gpg-user --trusted "$GPG_KEY_ID" 2>&1 || {
              echo "Warning: Failed to add GPG user, may already be added"
            }
          fi
          
          # Verify we can unlock now
          echo "Verifying git-crypt setup..."
          if git-crypt unlock 2>&1; then
            echo "✓ git-crypt unlock successful - GPG key is properly configured"
          else
            echo "ERROR: Still cannot unlock after adding GPG user!"
            exit 1
          fi
          
      - name: Prepare repository for encryption
        run: |
          set -e
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # First, commit any existing changes to have a clean state
          echo "Committing any existing changes..."
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Prepare for encryption: commit all changes" || echo "No changes to commit"
          fi
          
          # Remove .github directory from git tracking
          if git ls-files | grep -q "^\.github/"; then
            echo "Removing .github directory from git..."
            git rm -rf --cached .github 2>/dev/null || true
          fi
          
          # Remove other excluded directories
          for dir in docker examples tests; do
            if git ls-files | grep -q "^${dir}/"; then
              echo "Removing $dir directory from git..."
              git rm -rf --cached "$dir" 2>/dev/null || true
            fi
          done
          
          # Create commit to remove excluded directories (if any were removed)
          if [ -n "$(git status --porcelain)" ]; then
            echo "Creating commit to remove excluded directories..."
            git commit -m "Remove .github and other excluded directories for encrypted repo" || echo "No changes to commit"
          fi
          
          # Verify .github is removed from current HEAD
          if git ls-tree -r HEAD --name-only | grep -q "^\.github/"; then
            echo "ERROR: .github files still in HEAD!"
            git ls-tree -r HEAD --name-only | grep "^\.github/" | head -10
            exit 1
          fi
          
          # Ensure working directory is completely clean
          echo "Ensuring working directory is clean..."
          git reset --hard HEAD
          git clean -fd
          
          echo "✓ Repository prepared (excluded directories removed, working directory clean)"
          
      - name: Encrypt repository
        run: |
          set -e
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure working directory is completely clean before unlock
          echo "Ensuring working directory is clean for git-crypt unlock..."
          git reset --hard HEAD
          git clean -fd
          
          # Verify working directory is clean
          if [ -n "$(git status --porcelain)" ]; then
            echo "WARNING: Working directory still has uncommitted changes!"
            git status --short | head -20
            echo "Stashing changes..."
            git stash push -m "Stash before git-crypt unlock" || true
          fi
          
          echo "Unlocking git-crypt..."
          # Unlock is needed to apply filters when staging files
          # Working directory must be clean for unlock
          git-crypt unlock 2>&1 || {
            echo "ERROR: git-crypt unlock failed!"
            echo "Checking git status..."
            git status --short | head -20 || true
            echo "Checking git-crypt status..."
            git-crypt status | head -10 || true
            echo "Listing GPG keys..."
            gpg --list-secret-keys --keyid-format LONG || true
            exit 1
          }
          
          echo "✓ git-crypt unlocked successfully"
          
          echo "Checking encryption status (before re-encryption)..."
          git-crypt status 2>&1 | head -20 || true
          
          # CRITICAL: Force re-apply filters to all files
          # The issue is that even after unlock, files in HEAD are unencrypted.
          # We need to force git to re-process ALL files through the clean filter.
          echo "Re-applying git-crypt filters to force encryption..."
          
          # Remove all files from index
          git rm --cached -r . 2>/dev/null || true
          
          # Use --renormalize to force git to re-process all files through filters
          # This ensures the clean filter runs even if file content appears unchanged
          echo "Adding all files with --renormalize to force filter application..."
          git add --renormalize .
          
          # Also add any new/untracked files
          git add -A
          
          # Verify files are now encrypted in the index
          echo "Verifying encryption in index..."
          ENCRYPTED_COUNT=$(git-crypt status 2>&1 | grep -c "encrypted:" || echo "0")
          WARNING_COUNT=$(git-crypt status 2>&1 | grep -c "NOT ENCRYPTED" || echo "0")
          echo "Encrypted files count: $ENCRYPTED_COUNT"
          echo "Files with encryption warnings: $WARNING_COUNT"
          
          if [ "$WARNING_COUNT" -gt "0" ]; then
            echo "WARNING: Some files still show 'NOT ENCRYPTED' warnings!"
            echo "This may indicate the clean filter is not running properly."
            git-crypt status 2>&1 | grep "NOT ENCRYPTED" | head -10
            echo "Attempting alternative method: removing and re-adding files individually..."
            # Alternative: try removing and re-adding to force filter
            git rm --cached -r src/ data/ saves/ output/ Qwen3-*/ 2>/dev/null || true
            find . -name "*.py" -o -name "*.yaml" -o -name "*.yml" -o -name "*.md" -o -name "*.json" | \
              grep -v "^\./\.git/" | \
              grep -v "^\./\.github/" | \
              grep -v "^\./docker/" | \
              grep -v "^\./examples/" | \
              grep -v "^\./tests/" | \
              while read f; do
                git add --renormalize "$f" 2>/dev/null || true
              done
            git add -A
            WARNING_COUNT_AFTER=$(git-crypt status 2>&1 | grep -c "NOT ENCRYPTED" || echo "0")
            echo "Files with encryption warnings after retry: $WARNING_COUNT_AFTER"
          fi
          
          if [ "$ENCRYPTED_COUNT" -eq "0" ]; then
            echo "ERROR: No files are encrypted! This indicates a serious problem."
            git-crypt status 2>&1 | head -30
            exit 1
          fi
          
          git status --short | head -20 || true
          
          # Commit the encrypted blobs (index has encrypted content from clean filter)
          # Without this commit, we would push the previous commit which has unencrypted blobs
          echo "Creating commit with encrypted file contents..."
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Encrypted repository content (git-crypt)" || {
              echo "ERROR: Failed to create commit!"
              git status --short | head -20
              exit 1
            }
            echo "✓ Commit created successfully"
          else
            echo "WARNING: No changes to commit after re-add!"
            echo "This should not happen - there should be changes after renormalization."
            git status
            git commit --allow-empty -m "Encrypted repository content (git-crypt)"
          fi
          
          echo "✓ Repository encrypted and committed, ready for push"
          
      - name: Verify commit contains encrypted blobs (diagnostic)
        run: |
          set -e
          echo "=== DIAGNOSTIC: Checking what is actually stored in HEAD ==="
          echo "Current HEAD commit: $(git rev-parse HEAD)"
          echo ""
          
          # Check if src/train.py exists and what it looks like
          if git show HEAD:src/train.py >/dev/null 2>&1; then
            echo "=== src/train.py in HEAD ==="
            echo "File size: $(git show HEAD:src/train.py | wc -c) bytes"
            echo ""
            echo "First 200 bytes (hex dump):"
            git show HEAD:src/train.py | head -c 200 | xxd | head -15
            echo ""
            echo "First 5 lines as text (encrypted = binary/gibberish, unencrypted = readable Python):"
            git show HEAD:src/train.py | head -5
            echo ""
            
            # Check if it looks encrypted (encrypted files start with specific patterns)
            FIRST_BYTES=$(git show HEAD:src/train.py | head -c 50 | xxd -p | tr -d '\n')
            if echo "$FIRST_BYTES" | grep -q "^4749544352595054"; then
              echo "✓ File appears to be ENCRYPTED (starts with 'GITCRYPT' magic bytes)"
            else
              echo "⚠ File appears to be UNENCRYPTED (does not start with git-crypt magic bytes)"
              echo "   First 50 bytes (hex): $FIRST_BYTES"
            fi
          else
            echo "src/train.py not found in HEAD"
          fi
          
          echo ""
          echo "=== git-crypt status for HEAD ==="
          git-crypt status 2>&1 | head -30
          
          echo ""
          echo "=== Summary ==="
          ENCRYPTED=$(git-crypt status 2>&1 | grep -c "encrypted:" || echo "0")
          WARNINGS=$(git-crypt status 2>&1 | grep -c "NOT ENCRYPTED" || echo "0")
          echo "Files marked as encrypted: $ENCRYPTED"
          echo "Files with 'NOT ENCRYPTED' warnings: $WARNINGS"
          
      - name: Setup target repository
        env:
          ENCRYPTED_REPO_TOKEN: ${{ secrets.ENCRYPTED_REPO_TOKEN }}
        run: |
          set -e
          
          if [ -z "$ENCRYPTED_REPO_TOKEN" ]; then
            echo "Error: ENCRYPTED_REPO_TOKEN Secret is not set"
            exit 1
          fi
          
          echo "Debug: Token length: ${#ENCRYPTED_REPO_TOKEN}"
          echo "Debug: Token prefix: ${ENCRYPTED_REPO_TOKEN:0:7}..."
          echo "Debug: Target repo: ${{ env.ENCRYPTED_REPO }}"
          
          # Test token access
          echo "Testing token access to repository..."
          curl -s -H "Authorization: token $ENCRYPTED_REPO_TOKEN" \
            "https://api.github.com/repos/${{ env.ENCRYPTED_REPO }}" | \
            jq -r '.name, .private, .permissions' || echo "API test failed"

          # IMPORTANT:
          # actions/checkout configures http.https://github.com/.extraheader using GITHUB_TOKEN.
          # That extraheader applies to ALL github.com git traffic and can override our PAT,
          # causing private target repos to return "404 Repository not found".
          git config --local  --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote remove encrypted-origin 2>/dev/null || true
          
          echo "Adding remote repository: ${{ env.ENCRYPTED_REPO }}"
          
          # URL encode the token to handle special characters
          ENCODED_TOKEN=$(echo -n "$ENCRYPTED_REPO_TOKEN" | jq -sRr @uri)
          echo "Debug: Encoded token length: ${#ENCODED_TOKEN}"
          
          git remote add encrypted-origin "https://x-access-token:${ENCRYPTED_REPO_TOKEN}@github.com/${{ env.ENCRYPTED_REPO }}.git"
          
          git remote -v
          
          # Test remote access with verbose output
          echo "Testing remote access..."
          LS_REMOTE_RESULT=$(GIT_CURL_VERBOSE=1 GIT_TRACE=1 git ls-remote encrypted-origin HEAD 2>&1) || {
            echo "Warning: ls-remote failed"
            echo "Error output: $LS_REMOTE_RESULT"
          }
          
          if [ -n "$LS_REMOTE_RESULT" ] && echo "$LS_REMOTE_RESULT" | grep -q "refs/heads"; then
            echo "✓ Remote access successful"
            echo "$LS_REMOTE_RESULT" | head -5
          else
            echo "⚠ Remote access test inconclusive, will try push anyway"
          fi
          
      - name: Push to encrypted repository
        env:
          ENCRYPTED_REPO_TOKEN: ${{ secrets.ENCRYPTED_REPO_TOKEN }}
        run: |
          set -e

          # Unset checkout-injected auth header again (safety).
          git config --local  --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true

          # Re-add remote with PAT in URL.
          git remote remove encrypted-origin 2>/dev/null || true
          git remote add encrypted-origin "https://x-access-token:${ENCRYPTED_REPO_TOKEN}@github.com/${{ env.ENCRYPTED_REPO }}.git"
          
          echo "Verifying remote configuration..."
          git remote -v
          
          # Direct push attempt
          echo "Attempting to push to encrypted repository..."
          echo "Target: ${{ env.ENCRYPTED_REPO }}"
          echo "Branch: ${{ env.ENCRYPTED_BRANCH }}"
          
          # Try push
          export GIT_TERMINAL_PROMPT=0
          git push encrypted-origin HEAD:${{ env.ENCRYPTED_BRANCH }} 2>&1 || {
            echo "First push attempt failed, trying with --force..."
            git push encrypted-origin HEAD:${{ env.ENCRYPTED_BRANCH }} --force 2>&1 || {
              echo "Push failed. Final verification..."
              curl -s -H "Authorization: token ${ENCRYPTED_REPO_TOKEN}" \
                "https://api.github.com/repos/${{ env.ENCRYPTED_REPO }}" | jq -r '.name, .message, .permissions' || true
              exit 1
            }
          }
          
          echo "✓ Push successful!"
          
      - name: Cleanup
        if: always()
        run: |
          gpg --batch --yes --delete-secret-keys "$GPG_KEY_ID" || true
          gpg --batch --yes --delete-keys "$GPG_KEY_ID" || true
